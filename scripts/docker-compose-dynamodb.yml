services:
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    command: "-jar DynamoDBLocal.jar -sharedDb -dbPath ./data"
    container_name: adr-cross-dynamodb-local
    ports:
      - "8000:8000"
    volumes:
      - dynamodb-local-data:/home/dynamodblocal/data
    working_dir: /home/dynamodblocal/data

volumes:
  dynamodb-local-data:
