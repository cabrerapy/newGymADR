<figure class="overflow-hidden rounded-xl border border-adr-olive/40 bg-adr-gray-dark/50" [attr.aria-labelledby]="'photo-' + photo.id">
  <div
    class="photo-placeholder flex min-h-52 items-center justify-center sm:min-h-64"
    [attr.id]="'photo-' + photo.id"
    role="img"
    [attr.aria-label]="photo.title + '. ' + photo.description"
  >
    <svg class="h-12 w-12 text-adr-gold/80" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M4 5h16v14H4z" stroke="currentColor" stroke-width="1.5" />
      <path d="m4 16 4.2-4.2 3.2 3.2 2.5-2.5L20 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="9" cy="9" r="1.5" fill="currentColor" />
    </svg>
  </div>
  <figcaption class="p-5">
    <div class="flex flex-wrap items-center gap-3">
      <span class="rounded-full border border-adr-gold/40 px-2.5 py-1 text-xs font-bold uppercase tracking-[0.12em] text-adr-gold">
        Fotografía pendiente
      </span>
      <h3 class="text-lg font-bold text-adr-white">{{ photo.title }}</h3>
    </div>
    <p class="mt-3 text-sm leading-6 text-white/65">{{ photo.description }}</p>
  </figcaption>
</figure>
