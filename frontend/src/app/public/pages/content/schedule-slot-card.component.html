<article
  class="flex h-full flex-col rounded-xl border border-adr-olive/40 bg-adr-black/40 p-5"
  [class.p-4]="compact"
  [attr.aria-labelledby]="'schedule-title-' + slot.id"
>
  <div class="flex flex-wrap items-start justify-between gap-3">
    <p class="text-xs font-bold uppercase tracking-[0.12em] text-adr-gold">
      {{ slot.classType?.label || 'Tipo por confirmar' }}
    </p>
    <span class="rounded-full border border-white/15 px-2.5 py-1 text-[11px] font-bold uppercase tracking-[0.1em] text-white/60">
      {{ statusLabel(slot.status) }}
    </span>
  </div>
  <h3 [id]="'schedule-title-' + slot.id" class="mt-3 text-lg font-black text-adr-white">
    {{ slot.title }}
  </h3>
  <p class="mt-2 text-sm font-semibold text-adr-gold">
    <time [attr.datetime]="slot.startsAt">{{ slot.startsAt }}</time>
    <span aria-hidden="true">–</span>
    <time [attr.datetime]="slot.endsAt">{{ slot.endsAt }}</time>
  </p>
  <p class="mt-3 text-sm leading-6 text-white/65">{{ slot.description }}</p>
  <dl class="mt-auto grid grid-cols-1 gap-3 pt-4 text-sm sm:grid-cols-2">
    @if (slot.level) {
      <div>
        <dt class="text-xs font-bold uppercase tracking-[0.12em] text-white/50">Nivel</dt>
        <dd class="mt-1 text-white/85">{{ slot.level.label }}</dd>
      </div>
    }
    @if (slot.coach) {
      <div>
        <dt class="text-xs font-bold uppercase tracking-[0.12em] text-white/50">Entrenador</dt>
        <dd class="mt-1 text-white/85">{{ slot.coach.name }}</dd>
      </div>
    }
  </dl>
</article>
