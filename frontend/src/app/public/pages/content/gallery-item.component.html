<article
  class="flex h-full flex-col overflow-hidden rounded-xl border border-adr-olive/40 bg-adr-gray-dark/60"
  [attr.aria-labelledby]="'gallery-title-' + item.id"
>
  @if (item.image.status === 'approved' && item.image.src) {
    <div class="aspect-[4/3] overflow-hidden bg-adr-black">
      <img
        [ngSrc]="item.image.src"
        [alt]="item.image.alt"
        [width]="item.image.width"
        [height]="item.image.height"
        [sizes]="'(min-width: 1024px) 25vw, (min-width: 640px) 50vw, 100vw'"
        [loading]="index === 0 ? 'eager' : 'lazy'"
        [priority]="index === 0"
        decoding="async"
        class="h-full w-full object-cover"
      />
    </div>
  } @else {
    <div
      class="gallery-placeholder aspect-[4/3] flex items-center justify-center"
      role="img"
      [attr.aria-label]="'Fotografía de ' + (item.caption || item.image.alt) + ' pendiente de validación'"
    >
      <svg class="h-12 w-12 text-adr-gold/80" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M4 5h16v14H4z" stroke="currentColor" stroke-width="1.5" />
        <path d="m4 16 4.2-4.2 3.2 3.2 2.5-2.5L20 18" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
        <circle cx="9" cy="9" r="1.5" fill="currentColor" />
      </svg>
    </div>
  }

  <div class="flex flex-1 flex-col p-5">
    <div class="flex flex-wrap items-center justify-between gap-3">
      <span class="rounded-full border border-adr-gold/40 px-2.5 py-1 text-[11px] font-bold uppercase tracking-[0.1em] text-adr-gold">
        {{ statusLabel(item.status) }}
      </span>
      @if (item.image.status === 'approved') {
        <span class="text-[11px] font-semibold text-white/50">Imagen oficial</span>
      }
    </div>
    <h3 [id]="'gallery-title-' + item.id" class="mt-4 text-lg font-black text-adr-white">
      {{ item.caption || item.image.alt }}
    </h3>
    @if (item.image.caption && item.image.caption !== item.caption) {
      <p class="mt-2 text-sm leading-6 text-white/65">{{ item.image.caption }}</p>
    }
  </div>
</article>
