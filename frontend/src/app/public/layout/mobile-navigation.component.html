@if (open) {
  <div
    id="mobile-navigation"
    role="dialog"
    aria-modal="true"
    aria-labelledby="mobile-navigation-title"
    class="border-t border-adr-olive/30 bg-adr-deep px-4 py-4 shadow-2xl md:hidden"
    (keydown)="onKeydown($event)"
  >
    <div class="mb-4 flex items-center justify-between">
      <h2 id="mobile-navigation-title" class="sr-only">Menú de navegación móvil</h2>
      <p class="text-sm font-bold uppercase tracking-[0.18em] text-adr-gold" aria-hidden="true">Navegación</p>
      <button
        #closeButton
        type="button"
        class="inline-flex min-h-10 w-10 items-center justify-center rounded-md border border-white/20 text-adr-white hover:border-adr-gold hover:text-adr-gold focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-adr-gold"
        aria-label="Cerrar menú"
        (click)="close()"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <nav aria-label="Navegación móvil" class="flex flex-col">
      @for (item of navigationItems; track item.path) {
        <a
          [routerLink]="item.path"
          [routerLinkActiveOptions]="item.exact ? { exact: true } : { exact: false }"
          routerLinkActive="active-nav-link"
          [ariaCurrentWhenActive]="'page'"
          class="flex min-h-11 items-center rounded-md px-3 py-3 text-base font-semibold text-white/85 transition hover:bg-white/5 hover:text-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-adr-gold"
          (click)="close()"
        >
          {{ item.label }}
        </a>
      }

      <a
        routerLink="/acceso-alumnos"
        routerLinkActive="active-nav-link"
        [ariaCurrentWhenActive]="'page'"
        class="mt-2 flex min-h-11 items-center rounded-md bg-adr-gold px-3 py-3 text-base font-bold text-adr-black transition hover:bg-white focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-adr-gold"
        (click)="close()"
      >
        Acceso alumnos
      </a>
    </nav>
  </div>
}
