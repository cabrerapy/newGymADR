<aside class="hidden w-72 shrink-0 flex-col border-r border-adr-olive/25 bg-adr-deep lg:flex" aria-label="Navegación lateral del portal privado">
  <div class="border-b border-adr-olive/20 p-5">
    <p class="text-xs font-bold uppercase tracking-[0.18em] text-adr-gold">Áreas planificadas</p>
    <p class="mt-2 text-xs leading-5 text-white/60">La navegación real estará disponible después de la autorización backend.</p>
  </div>
  <nav aria-label="Navegación privada planificada" class="flex-1 overflow-y-auto p-3">
    <ul class="space-y-1">
      @for (item of navigationItems; track item.id) {
        <li>
          <span class="flex min-h-11 items-start gap-3 rounded-md px-3 py-3 text-sm text-white/75" aria-disabled="true">
            <span aria-hidden="true" class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-adr-gold"></span>
            <span class="min-w-0 flex-1">
              <span class="block font-semibold text-white/90">{{ item.label }}</span>
              <span class="mt-0.5 block text-xs text-white/55">{{ item.description }}</span>
            </span>
            <span class="shrink-0 text-[10px] font-bold uppercase tracking-[0.1em] text-adr-gold">Planificada</span>
          </span>
        </li>
      }
    </ul>
  </nav>
  <div class="border-t border-adr-olive/20 p-4 text-xs leading-5 text-white/55">
    Sin sesión, permisos ni datos operativos.
  </div>
</aside>
