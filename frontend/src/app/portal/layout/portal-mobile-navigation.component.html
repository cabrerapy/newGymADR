@if (open) {
  <div
    id="portal-mobile-navigation"
    role="dialog"
    aria-modal="true"
    aria-labelledby="portal-mobile-navigation-title"
    class="border-t border-adr-olive/30 bg-adr-deep px-4 py-4 shadow-2xl lg:hidden"
    (keydown)="onKeydown($event)"
  >
    <div class="mb-4 flex items-center justify-between gap-3">
      <h2 id="portal-mobile-navigation-title" class="text-sm font-bold uppercase tracking-[0.18em] text-adr-gold">Navegación planificada</h2>
      <button
        #closeButton
        type="button"
        class="inline-flex min-h-10 w-10 shrink-0 items-center justify-center rounded-md border border-white/20 text-adr-white hover:border-adr-gold hover:text-adr-gold focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-adr-gold"
        aria-label="Cerrar menú"
        (click)="close()"
      >
        <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
        </svg>
      </button>
    </div>

    <nav aria-label="Navegación privada planificada" class="flex flex-col">
      @for (item of navigationItems; track item.id) {
        <span class="flex min-h-12 items-start gap-3 rounded-md px-3 py-3 text-sm text-white/75" aria-disabled="true">
          <span aria-hidden="true" class="mt-1.5 h-1.5 w-1.5 shrink-0 rounded-full bg-adr-gold"></span>
          <span class="min-w-0 flex-1">
            <span class="block font-semibold text-white/90">{{ item.label }}</span>
            <span class="mt-0.5 block text-xs text-white/55">{{ item.description }}</span>
          </span>
          <span class="shrink-0 text-[10px] font-bold uppercase tracking-[0.1em] text-adr-gold">Planificada</span>
        </span>
      }
    </nav>
  </div>
}
